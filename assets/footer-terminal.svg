<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="Night City Terminal Sign-Off">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#111229"/>
      <stop offset="100%" stop-color="#1a091e"/>
    </linearGradient>
    <pattern id="hazardFoot" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#fcee0a"/>
      <rect x="8" width="8" height="16" fill="#080a10"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Consolas', 'Courier New', monospace; }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <!-- Full Dark Canvas -->
  <rect width="1200" height="160" fill="#06080f"/>
  <polygon points="18,8 1182,8 1182,134 1164,152 36,152 18,134" fill="url(#footBg)" stroke="#ff0055" stroke-opacity="0.6" stroke-width="1.5"/>
  <rect x="36" y="136" width="1128" height="6" fill="url(#hazardFoot)"/>

  <text x="600" y="48" text-anchor="middle" fill="#fcee0a" font-size="16" font-weight="900" class="mono" letter-spacing="4">
    ◈  W A K E   U P ,   D E V E L O P E R  —  W E   H A V E   C O D E   T O   S H I P  ◈
  </text>

  <text x="600" y="82" text-anchor="middle" fill="#00f0ff" font-size="14" class="mono">
    &gt; ssh mostfa2006-dev@nightcity.net --logout
  </text>

  <text x="588" y="112" text-anchor="middle" fill="#ff0055" font-size="14" font-weight="bold" class="mono">
    [ERR_0x2077] DISCONNECT DENIED: NETRUNNER STILL COMPILING
  </text>
  <rect x="840" y="98" width="9" height="16" fill="#fcee0a" class="cursor"/>
</svg>
