<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 145" width="1200" height="145" role="img" aria-label="Night City Terminal Sign-Off">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06080f"/>
      <stop offset="50%" stop-color="#0f1024"/>
      <stop offset="100%" stop-color="#17081a"/>
    </linearGradient>
    <pattern id="hazardFoot" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#fcee0a"/>
      <rect x="8" width="8" height="16" fill="#080a10"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Consolas', 'Courier New', monospace; }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <polygon points="0,0 1200,0 1200,125 1180,145 20,145 0,125" fill="url(#footBg)" stroke="#ff0055" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="20" y="128" width="1160" height="6" fill="url(#hazardFoot)"/>

  <text x="600" y="42" text-anchor="middle" fill="#fcee0a" font-size="16" font-weight="900" class="mono" letter-spacing="4">
    ◈  W A K E   U P ,   D E V E L O P E R  —  W E   H A V E   C O D E   T O   S H I P  ◈
  </text>

  <text x="600" y="76" text-anchor="middle" fill="#00f0ff" font-size="14" class="mono">
    &gt; ssh mostfa2006-dev@nightcity.net --logout
  </text>

  <text x="588" y="104" text-anchor="middle" fill="#ff0055" font-size="14" font-weight="bold" class="mono">
    [ERR_0x2077] DISCONNECT DENIED: NETRUNNER STILL COMPILING
  </text>
  <rect x="840" y="90" width="9" height="16" fill="#fcee0a" class="cursor"/>
</svg>
