  <!-- Row 3: Security & AI Line -->
  <text x="38" y="242" fill="#94a3b8" font-size="12" class="mono">&gt; LOADED MODULES: [AI_AGENTS] [CSRF_RBAC_SECURITY] [TAILWIND_CSS] [GIT_WORKFLOW] [LINUX_CLI] [VITE_TESTING]</text>
