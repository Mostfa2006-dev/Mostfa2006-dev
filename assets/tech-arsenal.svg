<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 285" width="1200" height="285" role="img" aria-label="Tech Arsenal and Quickhacks">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#12182e"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Consolas', 'Courier New', monospace; }
    .chip-label { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; font-weight: bold; }
  </style>

  <!-- Solid Night City Canvas -->
  <rect width="1200" height="285" fill="#06080f"/>

  <text x="20" y="30" fill="#00f0ff" font-size="15" font-weight="900" class="mono" letter-spacing="2.5">03 // TECH ARSENAL &amp; QUICKHACKS</text>
  <line x1="365" y1="25" x2="1182" y2="25" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1.5"/>

  <polygon points="18,46 1182,46 1182,256 1164,274 18,274" fill="url(#boxGrad)" stroke="#1e293b" stroke-width="1.5"/>

