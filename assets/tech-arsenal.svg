  <text x="38" y="80" fill="#fcee0a" font-size="12" font-weight="bold" class="mono" letter-spacing="1.8">[ NEURAL CORE // LANGUAGES ]</text>
  <g transform="translate(38, 92)">
    <rect x="0"   y="0" width="142" height="32" fill="#071521" stroke="#00f0ff" stroke-width="1.2"/><text x="71"  y="21" text-anchor="middle" fill="#00f0ff" class="chip-label">TYPESCRIPT</text>
    <rect x="154" y="0" width="142" height="32" fill="#1d1907" stroke="#fcee0a" stroke-width="1.2"/><text x="225" y="21" text-anchor="middle" fill="#fcee0a" class="chip-label">JAVASCRIPT</text>
