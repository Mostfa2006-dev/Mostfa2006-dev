    <rect x="430" y="0" width="118" height="32" fill="#071521" stroke="#00f0ff" stroke-width="1.2"/><text x="489" y="21" text-anchor="middle" fill="#00f0ff" class="chip-label">PHP 8 MVC</text>
    <rect x="560" y="0" width="114" height="32" fill="#1d1907" stroke="#fcee0a" stroke-width="1.2"/><text x="617" y="21" text-anchor="middle" fill="#fcee0a" class="chip-label">PYTHON</text>
    <rect x="686" y="0" width="142" height="32" fill="#071521" stroke="#00f0ff" stroke-width="1.2"/><text x="757" y="21" text-anchor="middle" fill="#00f0ff" class="chip-label">LUA / LUAU</text>
