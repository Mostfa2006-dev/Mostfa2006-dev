      <rect x="0" y="64" width="479" height="12" rx="2" fill="url(#barYellow)" class="bar-fill"/>

      <text x="0" y="108" fill="#e2e8f0" font-size="13" font-weight="bold">C / C++ / SDL2 GAME ARCHITECTURE</text>
      <text x="526" y="108" text-anchor="end" fill="#ff0055" font-size="13" font-weight="bold">89%</text>
      <rect x="0" y="118" width="526" height="12" rx="2" fill="#131c31"/>
      <rect x="0" y="118" width="468" height="12" rx="2" fill="url(#barPink)" class="bar-fill"/>

      <text x="0" y="162" fill="#e2e8f0" font-size="13" font-weight="bold">LUAU / ROBLOX SYSTEMS &amp; AUTOMATION</text>
      <text x="526" y="162" text-anchor="end" fill="#00f0ff" font-size="13" font-weight="bold">92%</text>
