      <text x="0" y="136" fill="#64748b">CURRENT GIG :</text>
      <text x="145" y="136" fill="#ff0055" font-weight="bold">Rendezvouya + System Break</text>

      <line x1="0" y1="162" x2="516" y2="162" stroke="#1e293b" stroke-width="1"/>

      <!-- Quick Vitals -->
      <text x="0" y="192" fill="#00f0ff" font-size="12" letter-spacing="1.5">NEURAL VITALS</text>

      <text x="0" y="222" fill="#cbd5e1" font-size="13">FOCUS OVERCLOCK</text>
      <rect x="165" y="210" width="280" height="14" rx="2" fill="#131c31"/>
      <rect x="165" y="210" width="268" height="14" rx="2" fill="url(#barYellow)" class="bar-fill"/>
      <text x="458" y="222" fill="#fcee0a" font-size="13" font-weight="bold">96%</text>

      <text x="0" y="250" fill="#cbd5e1" font-size="13">BUG EXTERMINATION</text>
      <rect x="165" y="238" width="280" height="14" rx="2" fill="#131c31"/>
      <rect x="165" y="238" width="252" height="14" rx="2" fill="url(#barCyan)" class="bar-fill"/>
      <text x="458" y="250" fill="#00f0ff" font-size="13" font-weight="bold">90%</text>

