<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 405" width="1200" height="405" role="img" aria-label="Cyberware Profile and Netrunner Stats">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18"/>
      <stop offset="100%" stop-color="#10172b"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0090ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
