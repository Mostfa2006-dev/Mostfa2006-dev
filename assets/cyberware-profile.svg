    <text x="20" y="25" fill="#06080f" font-size="15" font-weight="900" class="mono" letter-spacing="2">01 // NETRUNNER DOSSIER</text>
    <text x="454" y="24" fill="#06080f" font-size="12" font-weight="bold" class="mono">ID: #2006-TN</text>

    <g transform="translate(26, 74)" class="mono" font-size="14">
      <text x="0" y="0" fill="#64748b">HANDLE      :</text>
