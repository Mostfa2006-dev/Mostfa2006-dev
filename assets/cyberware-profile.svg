<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-label="Cyberware Profile and Netrunner Stats">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#0d1224"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0090ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="barYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#fcee0a"/>
    </linearGradient>
    <linearGradient id="barPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b000ff"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Consolas', 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', system-ui, sans-serif; }
    .bar-fill { animation: barGlow 2.4s ease-in-out infinite alternate; }
    @keyframes barGlow {
      0% { opacity: 0.82; }
      100% { opacity: 1; }
    }
  </style>

  <!-- LEFT PANEL: NETRUNNER DOSSIER -->
  <g transform="translate(10, 10)">
    <polygon points="18,0 565,0 565,332 547,350 0,350 0,18" fill="url(#panelBg)" stroke="#fcee0a" stroke-width="1.5"/>
    <rect x="0" y="0" width="565" height="38" fill="#fcee0a"/>
    <text x="20" y="25" fill="#070a13" font-size="15" font-weight="900" class="mono" letter-spacing="2">01 // NETRUNNER DOSSIER</text>
    <text x="452" y="24" fill="#070a13" font-size="12" font-weight="bold" class="mono">ID: #2006-TN</text>

    <g transform="translate(26, 72)" class="mono" font-size="14">
      <text x="0" y="0" fill="#64748b">HANDLE      :</text>
      <text x="145" y="0" fill="#fcee0a" font-weight="bold">Mostfa2006-dev</text>

      <text x="0" y="34" fill="#64748b">CLASS       :</text>
      <text x="145" y="34" fill="#00f0ff" font-weight="bold">Software Engineer &amp; Game Dev</text>

      <text x="0" y="68" fill="#64748b">SECTOR      :</text>
      <text x="145" y="68" fill="#e2e8f0">Tunisia // ESPRIT Engineering</text>

      <text x="0" y="102" fill="#64748b">FOCUS       :</text>
      <text x="145" y="102" fill="#e2e8f0">Full-Stack Web • AI • SDL2 • Luau</text>

      <text x="0" y="136" fill="#64748b">CURRENT GIG :</text>
      <text x="145" y="136" fill="#ff0055" font-weight="bold">Rendezvouya + System Break</text>

      <line x1="0" y1="162" x2="512" y2="162" stroke="#1e293b" stroke-width="1"/>

      <!-- Quick Vitals -->
      <text x="0" y="192" fill="#00f0ff" font-size="12" letter-spacing="1.5">NEURAL VITALS</text>

      <text x="0" y="220" fill="#cbd5e1" font-size="13">FOCUS OVERCLOCK</text>
      <rect x="165" y="208" width="280" height="14" rx="2" fill="#131c31"/>
      <rect x="165" y="208" width="268" height="14" rx="2" fill="url(#barYellow)" class="bar-fill"/>
      <text x="458" y="220" fill="#fcee0a" font-size="13" font-weight="bold">96%</text>

      <text x="0" y="248" fill="#cbd5e1" font-size="13">BUG EXTERMINATION</text>
      <rect x="165" y="236" width="280" height="14" rx="2" fill="#131c31"/>
      <rect x="165" y="236" width="252" height="14" rx="2" fill="url(#barCyan)" class="bar-fill"/>
      <text x="458" y="248" fill="#00f0ff" font-size="13" font-weight="bold">90%</text>

      <text x="0" y="276" fill="#cbd5e1" font-size="13">SLEEP BUFFER</text>
      <rect x="165" y="264" width="280" height="14" rx="2" fill="#131c31"/>
      <rect x="165" y="264" width="42" height="14" rx="2" fill="url(#barPink)" class="bar-fill"/>
      <text x="458" y="276" fill="#ff0055" font-size="13" font-weight="bold">404</text>
    </g>
  </g>

  <!-- RIGHT PANEL: CYBERWARE SKILL RIG -->
  <g transform="translate(595, 10)">
    <polygon points="18,0 595,0 595,332 577,350 0,350 0,18" fill="url(#panelBg)" stroke="#00f0ff" stroke-width="1.5"/>
    <rect x="0" y="0" width="595" height="38" fill="#0f1b33"/>
    <line x1="0" y1="38" x2="595" y2="38" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="20" y="25" fill="#00f0ff" font-size="15" font-weight="900" class="mono" letter-spacing="2">02 // INSTALLED CYBERWARE RIG</text>
    <text x="478" y="24" fill="#ff0055" font-size="12" font-weight="bold" class="mono">TIER: ICONIC</text>

    <g transform="translate(26, 72)" class="mono">
      <!-- Bar 1 -->
      <text x="0" y="0" fill="#e2e8f0" font-size="13" font-weight="bold">NEXT.JS / TYPESCRIPT / REACT</text>
      <text x="540" y="0" text-anchor="end" fill="#00f0ff" font-size="13" font-weight="bold">94%</text>
      <rect x="0" y="10" width="540" height="12" rx="2" fill="#131c31"/>
      <rect x="0" y="10" width="508" height="12" rx="2" fill="url(#barCyan)" class="bar-fill"/>

      <!-- Bar 2 -->
      <text x="0" y="52" fill="#e2e8f0" font-size="13" font-weight="bold">PHP 8 MVC / POSTGRESQL / MYSQL</text>
      <text x="540" y="52" text-anchor="end" fill="#fcee0a" font-size="13" font-weight="bold">91%</text>
      <rect x="0" y="62" width="540" height="12" rx="2" fill="#131c31"/>
      <rect x="0" y="62" width="491" height="12" rx="2" fill="url(#barYellow)" class="bar-fill"/>

      <!-- Bar 3 -->
      <text x="0" y="104" fill="#e2e8f0" font-size="13" font-weight="bold">C / C++ / SDL2 GAME ARCHITECTURE</text>
      <text x="540" y="104" text-anchor="end" fill="#ff0055" font-size="13" font-weight="bold">89%</text>
      <rect x="0" y="114" width="540" height="12" rx="2" fill="#131c31"/>
      <rect x="0" y="114" width="480" height="12" rx="2" fill="url(#barPink)" class="bar-fill"/>

      <!-- Bar 4 -->
      <text x="0" y="156" fill="#e2e8f0" font-size="13" font-weight="bold">LUAU / ROBLOX SYSTEMS &amp; AUTOMATION</text>
      <text x="540" y="156" text-anchor="end" fill="#00f0ff" font-size="13" font-weight="bold">92%</text>
      <rect x="0" y="166" width="540" height="12" rx="2" fill="#131c31"/>
      <rect x="0" y="166" width="497" height="12" rx="2" fill="url(#barCyan)" class="bar-fill"/>

      <!-- Bar 5 -->
      <text x="0" y="208" fill="#e2e8f0" font-size="13" font-weight="bold">AI AGENTS / SECURITY / WEB HARDENING</text>
      <text x="540" y="208" text-anchor="end" fill="#fcee0a" font-size="13" font-weight="bold">90%</text>
      <rect x="0" y="218" width="540" height="12" rx="2" fill="#131c31"/>
      <rect x="0" y="218" width="486" height="12" rx="2" fill="url(#barYellow)" class="bar-fill"/>

      <text x="0" y="266" fill="#94a3b8" font-size="12">&gt; quickhack.exec("ship_clean_code")  //  STATUS: 0 WARNINGS</text>
