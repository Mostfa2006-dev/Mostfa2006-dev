<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="MOSTFA2006-DEV Cyberpunk Netrunner Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060b"/>
      <stop offset="50%" stop-color="#0b0f1e"/>
      <stop offset="100%" stop-color="#13081c"/>
    </linearGradient>
    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#fcee0a"/>
      <stop offset="75%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowYellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00f0ff" fill-opacity="0.04"/>
    </pattern>
    <pattern id="hazard" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#fcee0a"/>
      <rect x="8" width="8" height="16" fill="#090b12"/>
    </pattern>
  </defs>

  <style>
    .title-main { font-family: 'Segoe UI', 'Orbitron', Impact, sans-serif; font-weight: 900; font-size: 74px; letter-spacing: 8px; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; }
    .glitch-cyan { animation: glitchA 3.2s infinite; }
    .glitch-pink { animation: glitchB 2.7s infinite; }
    .pulse-dot { animation: pulse 1.6s ease-in-out infinite; }
    .scan-bar { animation: scanMove 5s linear infinite; }
    .wave-1 { animation: wavePulse 1.4s ease-in-out infinite alternate; }
    .wave-2 { animation: wavePulse 1.1s ease-in-out 0.2s infinite alternate; }
    .wave-3 { animation: wavePulse 1.7s ease-in-out 0.4s infinite alternate; }
    .wave-4 { animation: wavePulse 0.9s ease-in-out 0.1s infinite alternate; }
    @keyframes glitchA {
      0%, 88%, 100% { transform: translate(0, 0); opacity: 0.7; }
      90% { transform: translate(-5px, -2px); opacity: 0.95; }
      92% { transform: translate(4px, 1px); opacity: 0.85; }
      94% { transform: translate(-2px, 0); opacity: 0.7; }
    }
    @keyframes glitchB {
      0%, 84%, 100% { transform: translate(0, 0); opacity: 0.65; }
      86% { transform: translate(5px, 2px); opacity: 0.95; }
      89% { transform: translate(-4px, -1px); opacity: 0.8; }
      91% { transform: translate(2px, 0); opacity: 0.65; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes scanMove {
      0% { transform: translateY(-20px); opacity: 0; }
      10% { opacity: 0.45; }
      90% { opacity: 0.45; }
      100% { transform: translateY(340px); opacity: 0; }
    }
    @keyframes wavePulse {
      0% { transform: scaleY(0.35); }
      100% { transform: scaleY(1); }
    }
  </style>

  <!-- Full Edge-to-Edge Dark Void Background (Zero White Corners in Light Mode) -->
  <rect width="1200" height="330" fill="#06080f"/>
  <polygon points="28,8 1192,8 1192,302 1172,322 8,322 8,28" fill="url(#bgGrad)"/>

  <!-- Cyber Perspective Grid -->
  <g stroke="url(#gridFade)" stroke-width="1">
    <line x1="8" y1="226" x2="1192" y2="226"/>
    <line x1="8" y1="250" x2="1192" y2="250"/>
    <line x1="8" y1="280" x2="1192" y2="280"/>
    <line x1="8" y1="310" x2="1192" y2="310"/>
    <line x1="600" y1="210" x2="40" y2="322"/>
    <line x1="600" y1="210" x2="210" y2="322"/>
    <line x1="600" y1="210" x2="390" y2="322"/>
    <line x1="600" y1="210" x2="600" y2="322"/>
    <line x1="600" y1="210" x2="810" y2="322"/>
    <line x1="600" y1="210" x2="990" y2="322"/>
    <line x1="600" y1="210" x2="1160" y2="322"/>
  </g>

  <!-- Subtle Glow Orbs -->
  <ellipse cx="260" cy="150" rx="230" ry="95" fill="#00f0ff" opacity="0.07"/>
  <ellipse cx="940" cy="160" rx="240" ry="95" fill="#ff0055" opacity="0.08"/>

  <!-- Outer Cyber Frame -->
  <polygon points="28,8 1192,8 1192,302 1172,322 8,322 8,28" fill="none" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Top Hazard Bar & HUD Telemetry -->
  <rect x="44" y="24" width="130" height="8" fill="url(#hazard)"/>
  <text x="190" y="32" fill="#fcee0a" font-size="12" class="mono" letter-spacing="2">NETWATCH_OS v20.77 // BREACH_PROTOCOL</text>

  <g transform="translate(918, 18)">
    <rect x="0" y="0" width="222" height="24" fill="#0e1628" stroke="#ff0055" stroke-width="1"/>
    <circle cx="15" cy="12" r="4" fill="#ff0055" class="pulse-dot"/>
    <text x="28" y="16" fill="#ff0055" font-size="11" class="mono" font-weight="bold" letter-spacing="1.4">ICE BYPASSED // ONLINE</text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 24 58 L 24 24 L 58 24" fill="none" stroke="#fcee0a" stroke-width="2.5"/>
  <path d="M 1176 272 L 1176 306 L 1142 306" fill="none" stroke="#fcee0a" stroke-width="2.5"/>
  <path d="M 1176 58 L 1176 24 L 1142 24" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 24 272 L 24 306 L 58 306" fill="none" stroke="#ff0055" stroke-width="2"/>

  <!-- Left Vertical Telemetry -->
  <g transform="translate(48, 102)" class="mono" font-size="11" fill="#00f0ff" opacity="0.88">
    <text x="0" y="0">NODE  :: TN-2077</text>
    <text x="0" y="20">LINK  :: NEURAL</text>
    <text x="0" y="40">RAM   :: 64GB OC</text>
    <text x="0" y="60" fill="#fcee0a">SLEEP :: ERR_404</text>
    <text x="0" y="80" fill="#ff0055">HEAT  :: 94°C</text>
  </g>

  <!-- Right Audio/Signal Spectrum -->
  <g transform="translate(1062, 108)">
    <text x="0" y="-10" fill="#00f0ff" font-size="10" class="mono" letter-spacing="1.5">SYNAPSE_HZ</text>
    <rect x="0"  y="22" width="8" height="48" fill="#00f0ff" class="wave-1" style="transform-origin: 4px 70px;"/>
    <rect x="14" y="10" width="8" height="60" fill="#fcee0a" class="wave-2" style="transform-origin: 18px 70px;"/>
    <rect x="28" y="30" width="8" height="40" fill="#ff0055" class="wave-3" style="transform-origin: 32px 70px;"/>
    <rect x="42" y="14" width="8" height="56" fill="#00f0ff" class="wave-4" style="transform-origin: 46px 70px;"/>
    <rect x="56" y="24" width="8" height="46" fill="#fcee0a" class="wave-1" style="transform-origin: 60px 70px;"/>
    <rect x="70" y="6"  width="8" height="64" fill="#ff0055" class="wave-2" style="transform-origin: 74px 70px;"/>
    <rect x="84" y="28" width="8" height="42" fill="#00f0ff" class="wave-3" style="transform-origin: 88px 70px;"/>
  </g>

  <!-- Center Glitch Title -->
  <g text-anchor="middle">
    <text x="596" y="168" fill="#00f0ff" class="title-main glitch-cyan" filter="url(#glowCyan)">MOSTFA2006-DEV</text>
    <text x="604" y="172" fill="#ff0055" class="title-main glitch-pink">MOSTFA2006-DEV</text>
    <text x="600" y="170" fill="#fcee0a" class="title-main" filter="url(#glowYellow)">MOSTFA2006-DEV</text>
  </g>

  <!-- Neon Divider & Role Subtitle -->
  <rect x="230" y="192" width="740" height="2" fill="url(#neonLine)"/>

  <g text-anchor="middle" class="mono">
    <text x="600" y="222" fill="#ffffff" font-size="17" font-weight="bold" letter-spacing="4">
      NETRUNNER // FULL-STACK • AI SYSTEMS • GAME ENGINE ARCHITECT
    </text>
    <text x="600" y="250" fill="#00f0ff" font-size="13" letter-spacing="2.5">
      [ TUNISIA SECTOR ]  •  [ NEXT.JS / PHP MVC ]  •  [ C / C++ / SDL2 ]  •  [ LUAU ]
    </text>
  </g>

  <!-- Bottom Cyber Status Pills -->
  <g transform="translate(300, 272)" class="mono" font-size="11">
    <rect x="0" y="0" width="170" height="24" fill="#0e172a" stroke="#fcee0a" stroke-width="1"/>
    <text x="85" y="16" text-anchor="middle" fill="#fcee0a" font-weight="bold">⚡ DAEMON: ACTIVE</text>

    <rect x="190" y="0" width="220" height="24" fill="#0e172a" stroke="#00f0ff" stroke-width="1"/>
    <text x="300" y="16" text-anchor="middle" fill="#00f0ff" font-weight="bold">◈ SYSTEM BREAK READY</text>

    <rect x="430" y="0" width="170" height="24" fill="#0e172a" stroke="#ff0055" stroke-width="1"/>
    <text x="515" y="16" text-anchor="middle" fill="#ff0055" font-weight="bold">▲ CAFFEINE: 100%</text>
  </g>

  <!-- Scanlines + Moving Sweep -->
  <rect width="1200" height="330" fill="url(#scanlines)"/>
  <rect x="0" y="0" width="1200" height="4" fill="#00f0ff" opacity="0.25" class="scan-bar"/>
</svg>
